repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.2
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: pycroscope
        name: pycroscope
        entry: python -m pycroscope --config-file pyproject.toml
        language: python
        pass_filenames: false
        files: ^(clirm|tests)/.*\.py$
        additional_dependencies:
          - git+https://github.com/JelleZijlstra/pycroscope@a62366e35ee38fc253fa6a98f75f63d771fdea4c
          - pytest
